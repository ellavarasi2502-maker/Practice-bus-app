<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Bus">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f2ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b201d" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>My Bus</title>
<style>
  :root {
    --bg: #f7f2ea; --card: #fffdf9; --ink: #2f3a33; --muted: #7c857d; --line: #ece5d8;
    --sage: #4f6f5b; --sage-soft: #e3ecdf; --chip: #f0eadf;
    --honey: #e8c06a; --honey-soft: #f8ecc9; --clay: #b96a54; --clay-soft: #f6e0d8;
    /* meadow art */
    --stem: #7d9a80; --leaf: #9db79b; --pollen: #e9bf5d; --sun: #fff3d6;
    --f1: #e8b4b0; --f2: #c9bce2; --f3: #fff9f0; --f4: #d98f8f;
    --sky-a: #f8ddd0; --sky-b: #f6ead9; --sky-c: #e2ebd9;
    --shadow: 0 1px 2px rgba(70,60,40,.04), 0 10px 28px rgba(70,60,40,.07);
    --serif: ui-serif, "New York", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b201d; --card: #242a26; --ink: #ebe7df; --muted: #979f97; --line: #333b35;
      --sage: #a9c7ad; --sage-soft: #2e3b32; --chip: #2d342f;
      --honey: #d9b566; --honey-soft: #453c25; --clay: #e6a08c; --clay-soft: #46302a;
      --stem: #6f8d74; --leaf: #5f7d64; --pollen: #d9b566; --sun: #e9e4d0;
      --f1: #c79a98; --f2: #a79bc4; --f3: #e6dfd2; --f4: #b97a7c;
      --sky-a: #2c3145; --sky-b: #2f3644; --sky-c: #2c3a33; --shadow: none; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom)); }
  .num { font-variant-numeric: tabular-nums; }
  .hidden { display: none !important; }

  /* header */
  .eyebrow { font-size: 13px; color: var(--muted); letter-spacing: .3px; }
  h1 { font-family: var(--serif); font-size: 34px; line-height: 1.1; font-weight: 500; letter-spacing: -.4px; margin: 2px 0 10px; }
  .stop { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; margin-bottom: 16px; max-width: 100%; }
  .stop svg { flex: none; color: var(--stem); }
  .stop span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* cards */
  .card { background: var(--card); border-radius: 24px; padding: 18px 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card-title { font-family: var(--serif); font-size: 19px; font-weight: 500; margin-bottom: 4px; }

  /* hero: a little meadow scene, with the times underneath */
  .hero { background: var(--card); border-radius: 30px; margin-bottom: 14px; overflow: hidden; box-shadow: var(--shadow); }
  .scene { position: relative; padding: 22px 22px 20px; min-height: 206px;
    background: linear-gradient(180deg, var(--sky-a) 0%, var(--sky-b) 55%, var(--sky-c) 100%); transition: background .4s; }
  .art { position: absolute; right: 0; bottom: 0; height: 100%; width: 62%; pointer-events: none; }
  .art svg { position: absolute; right: 0; bottom: 0; height: 100%; width: 100%; }
  .hero-top, .hero-big, .hero-msg { position: relative; z-index: 1; }
  .hero-label { font-size: 15px; color: var(--ink); opacity: .75; }
  .badge { display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 600; padding: 4px 11px; border-radius: 999px;
    background: rgba(255,255,255,.6); color: var(--ink); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  @media (prefers-color-scheme: dark) { .badge { background: rgba(255,255,255,.12); } }
  .hero-big { font-family: var(--serif); font-size: 104px; font-weight: 400; letter-spacing: -4px; line-height: .95; margin: 4px 0 0; color: var(--ink); }
  .hero-big small { font-size: 24px; letter-spacing: 0; margin-left: 8px; opacity: .75; }
  .hero-big.word { font-size: 68px; letter-spacing: -2px; line-height: 1.2; }
  .hero-msg { font-size: 15px; max-width: 62%; margin-top: 6px; }
  .hero.soon .scene { --sky-a: #f6d79a; --sky-b: #f8e6bf; --sky-c: #eee6c6; }
  .hero.late .scene { --sky-a: #e9b9a8; --sky-b: #f1d3c4; --sky-c: #ead9cf; }
  .hero.idle .scene { --sky-a: #e6ebe6; --sky-b: #eef0ea; --sky-c: #e6ecdf; }
  .hero.pm .scene { --sky-a: #f6dfb0; --sky-b: #f8ecd2; --sky-c: #e6ecd6; }
  @media (prefers-color-scheme: dark) {
    .hero.soon .scene { --sky-a: #4a4028; --sky-b: #3e3a2c; --sky-c: #2f3a30; }
    .hero.late .scene { --sky-a: #4d302b; --sky-b: #40312f; --sky-c: #30382f; }
    .hero.idle .scene { --sky-a: #2a302c; --sky-b: #2a302c; --sky-c: #2a342d; }
    .hero.pm .scene { --sky-a: #3d3a2c; --sky-b: #353a30; --sky-c: #2c3a33; }
  }
  .journey { display: flex; padding: 16px 22px 18px; }
  .step { flex: 1; position: relative; }
  .step .t { font-family: var(--serif); font-size: 24px; letter-spacing: -.3px; }
  .step .l { font-size: 12px; color: var(--muted); }
  .step + .step { padding-left: 16px; }
  .step + .step::before { content: ""; position: absolute; left: -2px; top: 14px; width: 8px; height: 1.5px; background: var(--stem); opacity: .6; }

  /* alert toggle */
  .alert { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border: 0; font-family: inherit; color: var(--ink); cursor: pointer; }
  .alert .txt { flex: 1; font-size: 16px; font-weight: 600; }
  .alert .txt span { display: block; font-size: 13px; font-weight: 400; color: var(--muted); margin-top: 2px; }
  .switch { flex: none; width: 52px; height: 32px; border-radius: 999px; background: var(--chip); position: relative; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
  .alert.on .switch { background: var(--stem); }
  .alert.on .switch::after { transform: translateX(20px); }

  /* bus rows */
  .bus { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line); }
  .bus:first-of-type { border-top: 0; }
  .bus.dim { opacity: .42; }
  .plate { flex: none; min-width: 50px; text-align: center; padding: 7px 8px; border-radius: 14px; font-weight: 600; font-size: 16px; background: var(--chip); }
  .plate.mine { background: var(--sage); color: var(--card); }
  .eta { flex: 1; min-width: 0; }
  .eta .m { font-family: var(--serif); font-size: 27px; letter-spacing: -.4px; line-height: 1.1; }
  .eta .m small { font-family: -apple-system, system-ui, sans-serif; font-size: 13px; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
  .eta .s { font-size: 13px; color: var(--muted); }
  .eta .s b { color: var(--sage); font-weight: 600; }
  .tag { flex: none; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; white-space: nowrap; background: var(--chip); color: var(--muted); }
  .tag.go { background: var(--sage-soft); color: var(--sage); }
  .tag.now { background: var(--honey-soft); color: var(--ink); }
  .tag.bad { background: var(--clay-soft); color: var(--clay); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .chip { font-size: 13px; background: var(--chip); border-radius: 999px; padding: 4px 11px; color: var(--muted); }
  .chip b { color: var(--ink); font-weight: 600; }
  .foot { font-size: 12px; color: var(--muted); margin: 12px 0 0; }
  .live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--stem); animation: pulse 2.4s infinite; margin-right: 6px; }
  @keyframes pulse { 50% { opacity: .3; } }

  /* plan (folds away) */
  details summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  details summary::-webkit-details-marker { display: none; }
  details summary .card-title { margin: 0; }
  details summary .sum { font-size: 14px; color: var(--muted); }
  details summary .sum b { color: var(--sage); font-family: var(--serif); font-size: 18px; font-weight: 500; }
  details summary::after { content: ""; flex: none; width: 8px; height: 8px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted);
    transform: rotate(45deg); margin: -4px 4px 0 2px; transition: transform .2s; }
  details[open] summary::after { transform: rotate(-135deg); margin-top: 4px; }
  .tl { position: relative; margin-top: 12px; }
  .tl::before { content: ""; position: absolute; left: 6px; top: 14px; bottom: 14px; width: 1.5px; background: var(--leaf); opacity: .6; }
  .tl-item { display: flex; align-items: center; gap: 14px; padding: 9px 0; position: relative; }
  .dot { flex: none; width: 14px; height: 14px; border-radius: 50%; background: var(--card); border: 2px solid var(--leaf); z-index: 1; }
  .dot.g { border-color: var(--stem); background: var(--stem); } .dot.r { border-color: var(--f4); }
  .tl-time { font-family: var(--serif); font-size: 24px; width: 70px; flex: none; }
  .tl-text { font-size: 15px; font-weight: 600; line-height: 1.25; }
  .tl-text span { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
  .note { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
  .note b { color: var(--ink); }

  /* settings */
  label.f { display: block; margin: 14px 0 5px; font-weight: 600; font-size: 14px; }
  input { width: 100%; padding: 12px 14px; font-size: 16px; border-radius: 14px; border: 1.5px solid var(--line);
    background: var(--bg); color: var(--ink); font-family: inherit; }
  input:focus { outline: none; border-color: var(--stem); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .btn { border: 0; border-radius: 16px; padding: 12px 16px; font-size: 15px; font-weight: 600; font-family: inherit;
    background: var(--sage); color: var(--card); cursor: pointer; }
  .btn.ghost { background: var(--chip); color: var(--ink); font-size: 14px; padding: 10px 13px; }
  .btn.wide { width: 100%; padding: 15px; font-size: 16px; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 5px; min-height: 18px; }
  .pick { background: var(--bg); border: 1.5px solid var(--line); border-radius: 14px; padding: 11px 13px; margin-top: 8px; font-size: 15px;
    width: 100%; text-align: left; color: var(--ink); font-family: inherit; }
  .err { color: var(--clay); font-size: 14px; margin: 8px 0 0; }

  /* tab bar */
  nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom));
    width: min(448px, calc(100% - 32px)); background: var(--card); border-radius: 26px; display: flex; padding: 6px;
    box-shadow: 0 2px 6px rgba(70,60,40,.07), 0 14px 34px rgba(70,60,40,.14); border: 1px solid var(--line); }
  nav button { flex: 1; border: 0; background: none; color: var(--muted); padding: 9px 4px 8px; font-size: 12px; font-weight: 600;
    border-radius: 20px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-family: inherit; cursor: pointer; }
  nav button.on { background: var(--sage-soft); color: var(--sage); }
</style>
</head>
<body>
<main>

  <!-- ============ MORNING ============ -->
  <section id="tab-morning">
    <div class="eyebrow" id="m-date">Morning</div>
    <h1 id="m-greet">Good morning</h1>
    <div class="stop"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg><span id="m-sub">Loading…</span></div>

    <div class="hero" id="m-hero">
      <div class="scene">
        <div class="art" data-art="am"></div>
        <div class="hero-top"><div class="hero-label" id="m-hero-label">Leave home in</div></div>
        <div class="hero-big num" id="m-hero-big">–</div>
        <div class="hero-msg" id="m-hero-msg"></div>
        <div class="badge hidden" id="m-badge"></div>
      </div>
      <div class="journey hidden" id="m-journey"></div>
    </div>

    <button class="card alert" id="alertBtn" aria-pressed="false">
      <div class="txt">Tell me when to leave<span id="alertMsg">Plays a sound and keeps the screen on</span></div>
      <div class="switch"></div>
    </button>

    <div class="card">
      <div class="card-title" id="m-list-title">Next buses</div>
      <div id="m-list"></div>
      <p class="foot" id="m-updated"></p>
    </div>

    <details class="card">
      <summary><div class="card-title">Tomorrow's plan</div><div class="sum" id="m-plan-sum"></div></summary>
      <div id="m-plan"></div>
    </details>
  </section>

  <!-- ============ AFTER SCHOOL ============ -->
  <section id="tab-school" class="hidden">
    <div class="eyebrow" id="s-date">After school</div>
    <h1>Heading home</h1>
    <div class="stop"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg><span id="s-sub">Loading…</span></div>

    <div class="hero pm" id="s-hero">
      <div class="scene">
        <div class="art" data-art="pm"></div>
        <div class="hero-top"><div class="hero-label" id="s-hero-label">Next bus home in</div></div>
        <div class="hero-big num" id="s-hero-big">–</div>
        <div class="hero-msg" id="s-hero-msg"></div>
        <div class="badge hidden" id="s-badge"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Buses at this stop</div>
      <div id="s-list"></div>
      <p class="foot" id="s-updated"></p>
    </div>
  </section>

  <!-- ============ SETTINGS ============ -->
  <section id="tab-settings" class="hidden">
    <div class="eyebrow">Saved on this phone only</div>
    <h1>Settings</h1>

    <div class="card">
      <div class="card-title">Bus stops</div>
      <label class="f" for="homeStop">Morning: where I board</label>
      <input id="homeStop" inputmode="numeric" maxlength="5" placeholder="27351">
      <div class="hint" id="homeStopName"></div>

      <label class="f" for="schoolStop">After school: where I board</label>
      <input id="schoolStop" inputmode="numeric" maxlength="5" placeholder="27539">
      <div class="hint" id="schoolStopName"></div>

      <label class="f" for="q">Find a stop by name</label>
      <input id="q" placeholder="e.g. Xingnan">
      <div id="results"></div>
      <div class="btns">
        <button class="btn ghost" id="nearHome">Near me → morning</button>
        <button class="btn ghost" id="nearSchool">Near me → after school</button>
      </div>
      <div id="nearby"></div>
    </div>

    <div class="card">
      <div class="card-title">My morning</div>
      <div class="two">
        <div><label class="f" for="bus">My bus</label><input id="bus" placeholder="99"></div>
        <div><label class="f" for="arriveBy">Reach school by</label><input id="arriveBy" type="time" value="06:40"></div>
        <div><label class="f" for="walk">Walk to stop (min)</label><input id="walk" type="number" inputmode="numeric" min="0" max="60"></div>
        <div><label class="f" for="ride">Bus ride (min)</label><input id="ride" type="number" inputmode="numeric" min="1" max="90"></div>
        <div><label class="f" for="walkEnd">Stop to school (min)</label><input id="walkEnd" type="number" inputmode="numeric" min="0" max="30"></div>
        <div><label class="f" for="buffer">Spare time (min)</label><input id="buffer" type="number" inputmode="numeric" min="0" max="15"></div>
        <div><label class="f" for="gap">Longest bus gap (min)</label><input id="gap" type="number" inputmode="numeric" min="1" max="40"></div>
      </div>
    </div>
    <button class="btn wide" id="save">Save</button>
    <div class="hint" id="saved" style="text-align:center"></div>
  </section>
</main>

<nav>
  <button data-tab="morning" class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 18h16M7 18a5 5 0 0 1 10 0M12 7v2.5M5.2 10.2l1.7 1.7M18.8 10.2l-1.7 1.7"/></svg>Morning</button>
  <button data-tab="school"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="14" rx="3.5"/><path d="M5 11.5h14M8.5 14.5h.01M15.5 14.5h.01M8 17.5V20M16 17.5V20"/></svg>After school</button>
  <button data-tab="settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Settings</button>
</nav>

<script>

// ---------- meadow artwork (drawn in code, colours follow the theme) ----------
function meadowSvg(kind) {
  const st = c => `style="fill:var(${c})"`;
  const stem = (x0, x, y, bend) => `<path d="M${x0} 172 Q ${x0 + bend} ${(172 + y) / 2} ${x} ${y}" fill="none" style="stroke:var(--stem)" stroke-width="1.8" stroke-linecap="round"/>`;
  const leaf = (x, y, len, ang) => `<path d="M0 0 C ${len * .3} ${-len * .38}, ${len * .8} ${-len * .3}, ${len} 0 C ${len * .8} ${len * .3}, ${len * .3} ${len * .38}, 0 0Z" transform="translate(${x} ${y}) rotate(${ang})" ${st('--leaf')}/>`;
  const flower = (x, y, r, n, col, rot = 0) => {
    let p = '';
    for (let i = 0; i < n; i++) p += `<ellipse cx="${x}" cy="${y - r * .6}" rx="${r * .33}" ry="${r * .6}" transform="rotate(${rot + i * 360 / n} ${x} ${y})"/>`;
    return `<g ${st(col)} opacity=".96">${p}</g><circle cx="${x}" cy="${y}" r="${r * .27}" ${st('--pollen')}/>`;
  };
  const bud = (x, y, r, col, ang = 0) => `<g transform="translate(${x} ${y}) rotate(${ang})"><path d="M0 0 C ${-r} ${-r * .4}, ${-r * .9} ${-r * 1.9}, 0 ${-r * 2.3} C ${r * .9} ${-r * 1.9}, ${r} ${-r * .4}, 0 0Z" ${st(col)}/><path d="M0 0 C ${-r * .5} ${-r * .2}, ${-r * .8} ${-r * .9}, ${-r * .75} ${-r * 1.3} C ${-r * .3} ${-r}, 0 ${-r * .6}, 0 0Z" ${st('--leaf')}/><path d="M0 0 C ${r * .5} ${-r * .2}, ${r * .8} ${-r * .9}, ${r * .75} ${-r * 1.3} C ${r * .3} ${-r}, 0 ${-r * .6}, 0 0Z" ${st('--leaf')}/></g>`;
  const sprig = (x0, x, y, col) => { // lavender-like spike
    let p = stem(x0, x, y, (x - x0) * .2);
    for (let i = 0; i < 7; i++) { const t = i / 7, yy = y + t * 44, xx = x + (x0 - x) * t * .28, w = 3 + t * 1.6;
      p += `<ellipse cx="${xx - w}" cy="${yy}" rx="${w}" ry="3.6" transform="rotate(-28 ${xx - w} ${yy})" ${st(col)}/><ellipse cx="${xx + w}" cy="${yy}" rx="${w}" ry="3.6" transform="rotate(28 ${xx + w} ${yy})" ${st(col)}/>`; }
    return p + `<ellipse cx="${x}" cy="${y - 4}" rx="3" ry="4.5" ${st(col)}/>`;
  };
  const grass = xs => xs.map(([x, h, b]) => `<path d="M${x} 172 Q ${x + b * .4} ${172 - h * .6} ${x + b} ${172 - h}" fill="none" style="stroke:var(--leaf)" stroke-width="1.6" stroke-linecap="round"/>`).join('');
  const am = kind === 'am';
  return `<svg viewBox="0 0 230 170" preserveAspectRatio="xMaxYMax meet" aria-hidden="true">
    <circle cx="${am ? 168 : 60}" cy="${am ? 52 : 44}" r="${am ? 40 : 30}" ${st('--sun')} opacity=".75"/>
    ${grass([[40, 26, -8], [58, 34, 6], [84, 22, -5], [128, 30, 7], [160, 24, -6], [218, 30, -7]])}
    ${sprig(70, 62, 86, '--f2')}${sprig(214, 221, 70, '--f2')}
    ${stem(112, 104, 104, -6)}${leaf(110, 140, 20, -150)}${flower(104, 104, 13, 7, '--f3', 10)}
    ${stem(150, 146, 52, 10)}${leaf(151, 128, 26, -30)}${leaf(150, 108, 22, -155)}${flower(146, 52, 23, 8, am ? '--f1' : '--f4')}
    ${stem(184, 190, 88, -8)}${leaf(184, 140, 20, -35)}${flower(190, 88, 17, 6, am ? '--f4' : '--f1', 15)}
    ${stem(128, 124, 128, 4)}${bud(124, 128, 7, '--f1', -8)}
    ${stem(200, 204, 128, 3)}${bud(204, 128, 6, '--f3', 10)}
    ${grass([[100, 20, 5], [140, 18, -4], [174, 22, 5], [196, 16, -3]])}
  </svg>`;
}
document.querySelectorAll('.art').forEach(a => { a.innerHTML = meadowSvg(a.dataset.art); });

// ---------- data sources ----------
// Live arrivals: arrivelah (free, no key, proxies LTA DataMall). Stop names: busrouter.sg data.
const ARRIVAL_URL = code => `https://arrivelah2.busrouter.sg/?id=${code}`;
const FIRSTLAST_URL = 'https://data.busrouter.sg/v1/firstlast.min.json';
const STOPS_URL = 'https://data.busrouter.sg/v1/stops.min.json';
const DEMO = new URLSearchParams(location.search).has('demo');

// ---------- settings ----------
const DEFAULTS = { homeStop: '27351', schoolStop: '27539', bus: '99', arriveBy: '06:40', walk: 10, ride: 8, walkEnd: 1, buffer: 1, gap: 13 };
function loadSettings() {
  try { return { ...DEFAULTS, ...JSON.parse(localStorage.getItem('mybus') || '{}') }; } catch { return { ...DEFAULTS }; }
}
function saveSettings(s) { try { localStorage.setItem('mybus', JSON.stringify(s)); } catch {} }
let S = loadSettings();
// v2: the timetable shows the ride to Juying is about 7 min, so replace the old 15-min guess
if (!S.v && +S.ride === 15) S.ride = DEFAULTS.ride;
// v3: walk from the stop to the school gate is 1 min, not the old 3-min guess
if ((S.v || 0) < 3 && +S.walkEnd === 3) S.walkEnd = DEFAULTS.walkEnd;
// v4: aim to reach school by 06:40 (school starts 07:00), not 06:30
if ((S.v || 0) < 4 && S.arriveBy === '06:30') S.arriveBy = DEFAULTS.arriveBy;
S.v = 4;
if (!S.homeStop) S.homeStop = DEFAULTS.homeStop;
if (!S.schoolStop) S.schoolStop = DEFAULTS.schoolStop;

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const hhmm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const addMin = (d, m) => new Date(d.getTime() + m * 60000);
function todayAt(hm, base = new Date()) {
  const [h, m] = hm.split(':').map(Number);
  const d = new Date(base); d.setHours(h, m, 0, 0); return d;
}
// Next occurrence of the school deadline (today until 30 min after it, else tomorrow)
function nextDeadline(now = new Date()) {
  let d = todayAt(S.arriveBy, now);
  if (now > addMin(d, 30)) d = addMin(d, 24 * 60);
  return d;
}
// Only judge "on time / late" during the morning rush (within 3 h before the deadline)
const inMorningWindow = (now, deadline) => deadline - now <= 3 * 3600000;
const minsUntil = (d, now = new Date()) => Math.round((d - now) / 60000);
const etaHtml = m => m <= 0 ? 'Now' : `${m}<small>min</small>`;
const etaText = m => m <= 0 ? 'now' : `${m} min`;

// ---------- stop names ----------
let STOPS = null; // { code: [lng, lat, name, road] }
async function loadStops() {
  if (STOPS) return STOPS;
  try {
    const cached = localStorage.getItem('mybus-stops');
    if (cached) { STOPS = JSON.parse(cached); return STOPS; }
  } catch {}
  try {
    const r = await fetch(STOPS_URL); STOPS = await r.json();
    try { localStorage.setItem('mybus-stops', JSON.stringify(STOPS)); } catch {}
  } catch { STOPS = {}; }
  return STOPS;
}
function stopLabel(code) {
  if (!code) return '';
  const s = STOPS && STOPS[code];
  return s ? `${s[2]} · ${s[3]} · ${code}` : `Stop ${code}`;
}

// ---------- first bus of the day (timetable) ----------
// Source lines look like "99 0533 0037 0524 = 0534 0040": weekday first/last, Sat first/last, Sun first/last ("=" = same as weekday)
let FIRST = null; // { stopCode: [lines] } for my stops only
try { FIRST = JSON.parse(localStorage.getItem('mybus-first') || 'null'); } catch {}
async function loadFirst() {
  if (FIRST && FIRST[S.homeStop] && FIRST[S.schoolStop]) return;
  try {
    const all = await (await fetch(FIRSTLAST_URL)).json();
    FIRST = { [S.homeStop]: all[S.homeStop] || [], [S.schoolStop]: all[S.schoolStop] || [] };
    try { localStorage.setItem('mybus-first', JSON.stringify(FIRST)); } catch {}
  } catch {}
}
// First bus at a stop on the given date, as "HH:MM", or '' if unknown
function firstBus(code, bus, date) {
  const line = FIRST && (FIRST[code] || []).find(l => l.split(' ')[0] === bus);
  if (!line) return '';
  const f = line.split(' '), day = date.getDay();
  let t = f[day === 6 ? 3 : day === 0 ? 5 : 1];
  if (t === '=') t = f[1];
  return /^\d{4}$/.test(t) ? t.slice(0, 2) + ':' + t.slice(2) : '';
}

// ---------- live arrivals ----------
// Returns [{ no, times: [Date, Date, Date] }]
const cache = {}; // code -> { at, data }
async function getArrivals(code, maxAge = 0) {
  const c = cache[code];
  if (c && Date.now() - c.at < maxAge) return c.data;
  const data = await fetchArrivals(code);
  cache[code] = { at: Date.now(), data };
  return data;
}
async function fetchArrivals(code) {
  if (DEMO) return demoArrivals(code);
  const r = await fetch(ARRIVAL_URL(code));
  if (!r.ok) throw new Error('Could not load bus times');
  const j = await r.json();
  return (j.services || []).map(s => ({
    no: s.no,
    times: [s.next, s.subsequent || s.next2, s.next3]
      .filter(x => x && x.time).map(x => new Date(x.time))
  })).filter(s => s.times.length).sort((a, b) => a.no.localeCompare(b.no, undefined, { numeric: true }));
}
const demoStart = Date.now();
function demoArrivals(code) {
  const now = DEMO && +new URLSearchParams(location.search).get('demo') ? demoStart : Date.now(), t = m => new Date(now + m * 60000);
  if (code === S.schoolStop) return [
    { no: '99', times: [t(2), t(11), t(24)] }, { no: '182', times: [t(5), t(14), t(22)] },
    { no: '193', times: [t(9), t(21), t(33)] }, { no: '252', times: [t(0), t(7), t(18)] }];
  return [{ no: S.bus, times: [t(6), t(16), t(29)] }, { no: '182', times: [t(3), t(12), t(20)] }];
}
const footHtml = now => `<span class="live"></span>Live · updated ${hhmm(now)}${DEMO ? ' · demo data' : ''}`;

// ---------- MORNING ----------
function renderPlan() {
  const deadline = nextDeadline();
  const latestBus = addMin(deadline, -(+S.ride + +S.walkEnd));
  const lead = +S.walk + +S.buffer;
  const safeLeave = addMin(latestBus, -(+S.gap + lead));
  const lastLeave = addMin(latestBus, -lead);
  const first = firstBus(S.homeStop, S.bus, deadline);
  $('m-plan-sum').innerHTML = `leave by <b class="num">${hhmm(safeLeave)}</b>`;
  $('m-plan').innerHTML = `<div class="tl">
    <div class="tl-item"><div class="dot g"></div><div class="tl-time num">${hhmm(safeLeave)}</div>
      <div class="tl-text">Leave home<span>Safe even if you just miss a bus</span></div></div>
    <div class="tl-item"><div class="dot r"></div><div class="tl-time num">${hhmm(lastLeave)}</div>
      <div class="tl-text">Very latest to leave<span>Only works if a bus comes at once</span></div></div>
    <div class="tl-item"><div class="dot"></div><div class="tl-time num">${hhmm(latestBus)}</div>
      <div class="tl-text">Last bus ${S.bus} that makes it</div></div>
    <div class="tl-item"><div class="dot"></div><div class="tl-time num">${hhmm(deadline)}</div>
      <div class="tl-text">At school</div></div>
  </div>
  ${first ? `<p class="note">First bus ${S.bus} of the day passes your stop at <b>${first}</b>${first > hhmm(latestBus) ? ' — too late to reach school on time' : ''}.</p>` : ''}
  <p class="note">${S.walk} min walk · up to ${S.gap} min wait · ${S.ride} min ride · ${S.walkEnd} min walk</p>`;
}

function setHero({ label, big, msg = '', cls = '', badge = '', journey = '', word = false }) {
  $('m-hero').className = 'hero ' + cls;
  $('m-hero-label').textContent = label;
  $('m-hero-big').innerHTML = big; $('m-hero-big').classList.toggle('word', word);
  $('m-hero-msg').innerHTML = msg; $('m-hero-msg').classList.toggle('hidden', !msg);
  $('m-badge').textContent = badge; $('m-badge').classList.toggle('hidden', !badge);
  $('m-journey').innerHTML = journey; $('m-journey').classList.toggle('hidden', !journey);
}

async function renderMorning(maxAge = 0) {
  renderPlan();
  const now = new Date();
  const deadline = nextDeadline(now);
  const judge = inMorningWindow(now, deadline);
  const latestBus = addMin(deadline, -(+S.ride + +S.walkEnd));
  const lead = +S.walk + +S.buffer; // minutes needed before the bus arrives
  $('m-sub').textContent = stopLabel(S.homeStop);
  const hr = now.getHours();
  $('m-greet').textContent = hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening';
  $('m-date').textContent = now.toLocaleDateString('en-SG', { weekday: 'long', day: 'numeric', month: 'long' });
  $('m-list-title').textContent = `Next bus ${S.bus}`;

  let services;
  try { services = await getArrivals(S.homeStop, maxAge); }
  catch (e) {
    setHero({ label: 'No connection', big: '–', cls: 'idle', msg: `Use the plan below: leave by <b>${hhmm(addMin(latestBus, -(+S.gap + lead)))}</b>.` });
    $('m-list').innerHTML = `<p class="err">${e.message}. Check your internet.</p>`; $('m-updated').innerHTML = ''; return;
  }

  const mine = services.find(s => s.no === S.bus);
  if (!mine) {
    setHero({ label: `No bus ${S.bus} right now`, big: '–', cls: 'idle',
      msg: `No live times yet${firstBus(S.homeStop, S.bus, now) ? ` (first bus is at ${firstBus(S.homeStop, S.bus, now)})` : ''}. Use the plan below: leave by <b>${hhmm(addMin(latestBus, -(+S.gap + lead)))}</b>.` });
    $('m-list').innerHTML = '<p class="note">Nothing coming yet.</p>';
  } else {
    const options = mine.times.map(t => {
      const leave = addMin(t, -lead), reach = addMin(t, +S.ride + +S.walkEnd);
      return { bus: t, leave, reach, canMake: leave >= addMin(now, -0.5), onTime: reach <= deadline };
    });
    // In the morning, aim for the LATEST bus that still gets me there on time (leave as late as possible).
    // If none is on time, or outside the morning, aim for the earliest catchable bus.
    const best = (judge && options.filter(o => o.canMake && o.onTime).pop()) || options.find(o => o.canMake);
    if (!best) {
      setHero({ label: 'One moment', big: 'Soon', word: true, cls: 'idle', msg: `The next ${S.bus}s come too soon to walk there. New times will show shortly.` });
    } else {
      const m = minsUntil(best.leave, now);
      const late = judge && !best.onTime;
      checkAlert(m);
      setHero({
        label: m <= 0 ? 'Leave home' : 'Leave home in',
        big: m <= 0 ? 'Now' : `${m}<small>min</small>`, word: m <= 0,
        cls: late ? 'late' : m <= 3 ? 'soon' : '',
        badge: !judge ? '' : late ? 'A little late today' : 'Plenty of time · latest bus',
        journey: `<div class="step"><div class="t num">${hhmm(best.leave)}</div><div class="l">Leave home</div></div>
          <div class="step"><div class="t num">${hhmm(best.bus)}</div><div class="l">Bus ${S.bus}</div></div>
          <div class="step"><div class="t num">${hhmm(best.reach)}</div><div class="l">At school</div></div>`
      });
    }
    $('m-list').innerHTML = options.map(o => {
      const tag = !o.canMake ? '<span class="tag">Too soon</span>'
        : judge && !o.onTime ? `<span class="tag bad">Late · leave ${hhmm(o.leave)}</span>`
        : `<span class="tag go">Leave ${hhmm(o.leave)}</span>`;
      return `<div class="bus ${o.canMake ? '' : 'dim'}">
        <div class="eta"><div class="m num">${etaHtml(minsUntil(o.bus, now))}</div><div class="s num">arrives ${hhmm(o.bus)}${o === best && judge ? ' · <b>your bus</b>' : ''}</div></div>${tag}</div>`;
    }).join('');
  }
  const others = services.filter(s => s.no !== S.bus);
  if (others.length) $('m-list').innerHTML += `<div class="chips">${others.map(s =>
    `<span class="chip num"><b>${s.no}</b> ${etaText(minsUntil(s.times[0], now))}</span>`).join('')}</div>`;
  $('m-updated').innerHTML = footHtml(now);
}

// ---------- LEAVE ALERT (sound + keep screen on) ----------
// Only works while the app is open on screen; web apps cannot ring when the phone is locked.
let alertOn = false, audio = null, wakeLock = null, lastReady = 0, lastGo = 0;
try { alertOn = localStorage.getItem('mybus-alert') === '1'; } catch {}
function tone(freq, start, dur, vol = 0.25) {
  const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + start;
  o.type = 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur + 0.05);
}
function chime(kind) {
  if (!audio || audio.state !== 'running') return;
  if (kind === 'ready') { tone(660, 0, .35); tone(880, .25, .5); }
  else [0, 1.1, 2.2].forEach(d => { tone(784, d, .25, .35); tone(988, d + .2, .25, .35); tone(1175, d + .4, .5, .35); });
}
function unlockAudio() { // must run inside a tap
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state !== 'running') audio.resume().then(drawAlert);
  } catch {}
}
async function keepAwake() {
  if (!alertOn || document.hidden || wakeLock || !('wakeLock' in navigator)) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } catch {}
}
function drawAlert() {
  $('alertBtn').classList.toggle('on', alertOn); $('alertBtn').setAttribute('aria-pressed', alertOn);
  $('alertMsg').textContent = !alertOn ? 'Plays a sound and keeps the screen on'
    : !audio || audio.state !== 'running' ? 'Tap anywhere to switch the sound on'
    : 'On. Keep this app open, with silent mode off';
}
$('alertBtn').onclick = () => {
  alertOn = !alertOn;
  try { localStorage.setItem('mybus-alert', alertOn ? '1' : '0'); } catch {}
  if (alertOn) { unlockAudio(); keepAwake(); setTimeout(() => chime('ready'), 150); }
  else if (wakeLock) wakeLock.release();
  drawAlert();
};
document.addEventListener('pointerdown', () => { if (alertOn && (!audio || audio.state !== 'running')) unlockAudio(); });
// m = whole minutes until it is time to leave for the next catchable bus
function checkAlert(m) {
  if (!alertOn) return;
  const t = Date.now();
  if (m <= 0 && t - lastGo > 4 * 60000) { lastGo = t; lastReady = t; chime('go'); }
  else if (m > 0 && m <= 2 && t - lastReady > 4 * 60000) { lastReady = t; chime('ready'); }
}

// ---------- AFTER SCHOOL ----------
async function renderSchool() {
  $('s-sub').textContent = stopLabel(S.schoolStop);
  const now = new Date();
  $('s-date').textContent = now.toLocaleDateString('en-SG', { weekday: 'long', day: 'numeric', month: 'long' });
  const sHero = (label, big, msg, badge, word) => {
    $('s-hero-label').textContent = label; $('s-hero-big').innerHTML = big; $('s-hero-big').classList.toggle('word', !!word);
    $('s-hero-msg').textContent = msg; $('s-badge').textContent = badge || ''; $('s-badge').classList.toggle('hidden', !badge);
  };
  let services;
  try { services = await getArrivals(S.schoolStop); }
  catch (e) { $('s-list').innerHTML = `<p class="err">${e.message}. Check your internet.</p>`; $('s-updated').innerHTML = ''; sHero('No connection', '–', '', ''); return; }
  const home = services.find(s => s.no === S.bus);
  if (home) {
    const [n, ...rest] = home.times.map(t => minsUntil(t, now)), out = n - (+S.walkEnd);
    sHero(`Bus ${S.bus} home in`, n <= 0 ? 'Now' : `${n}<small>min</small>`, rest.length ? 'then ' + rest.map(etaText).join(', ') : '',
      n <= 0 ? 'Arriving now' : out <= 0 ? 'Time to go' : `Head out in ${out} min`, n <= 0);
  } else sHero(`Bus ${S.bus}`, '–', 'No live times right now', '');
  if (!services.length) { $('s-list').innerHTML = '<p class="note">No buses right now.</p>'; $('s-updated').innerHTML = footHtml(now); return; }
  services.sort((a, b) => (b.no === S.bus) - (a.no === S.bus) || a.times[0] - b.times[0]);
  $('s-list').innerHTML = services.map(s => {
    const [n, ...rest] = s.times.map(t => minsUntil(t, now));
    const out = n - (+S.walkEnd);
    const tag = n <= 0 ? '<span class="tag">Arriving</span>'
      : out <= 0 ? '<span class="tag now">Go now</span>' : `<span class="tag go">Go in ${out} min</span>`;
    return `<div class="bus"><div class="plate ${s.no === S.bus ? 'mine' : ''}">${s.no}</div>
      <div class="eta"><div class="m num">${etaHtml(n)}</div>
      <div class="s num">${rest.length ? 'then ' + rest.map(etaText).join(', ') : 'last one shown'}</div></div>${tag}</div>`;
  }).join('');
  $('s-updated').innerHTML = footHtml(now) + ` · "Go in" allows ${S.walkEnd} min to reach the stop`;
}

// ---------- SETTINGS ----------
const FIELDS = ['homeStop', 'schoolStop', 'bus', 'arriveBy', 'walk', 'ride', 'walkEnd', 'buffer', 'gap'];
function fillSettings() {
  FIELDS.forEach(k => $(k).value = S[k]);
  $('homeStopName').textContent = stopLabel(S.homeStop);
  $('schoolStopName').textContent = stopLabel(S.schoolStop);
}
['homeStop', 'schoolStop'].forEach(k => $(k).addEventListener('input', () => {
  $(k + 'Name').textContent = $(k).value.length === 5 ? stopLabel($(k).value) : '';
}));
$('save').onclick = () => {
  FIELDS.forEach(k => S[k] = $(k).value.trim() || DEFAULTS[k]);
  saveSettings(S); fillSettings(); loadFirst();
  $('saved').textContent = 'Saved ✓'; setTimeout(() => $('saved').textContent = '', 2000);
};
function distM(lat1, lng1, lat2, lng2) {
  const R = 6371000, r = Math.PI / 180;
  const x = (lng2 - lng1) * r * Math.cos((lat1 + lat2) / 2 * r), y = (lat2 - lat1) * r;
  return Math.round(Math.sqrt(x * x + y * y) * R);
}
function pickStop(target, code, box) {
  $(target).value = code; $(target + 'Name').textContent = stopLabel(code);
  box.innerHTML = '<p class="note">Picked. Press Save.</p>';
}
// Search stops by name; each result can be set as the morning or after-school stop
$('q').addEventListener('input', async () => {
  const q = $('q').value.trim().toLowerCase(), box = $('results');
  if (q.length < 3) { box.innerHTML = ''; return; }
  await loadStops();
  const list = Object.entries(STOPS).filter(([c, s]) => (s[2] + ' ' + s[3] + ' ' + c).toLowerCase().includes(q)).slice(0, 8);
  box.innerHTML = list.length ? list.map(([c, s]) =>
    `<div class="pick"><b>${s[2]}</b> · ${s[3]} · ${c}
     <div class="btns"><button class="btn ghost" data-t="homeStop" data-code="${c}">Use for morning</button>
     <button class="btn ghost" data-t="schoolStop" data-code="${c}">Use for after school</button></div></div>`).join('')
    : `<p class="note">${Object.keys(STOPS).length ? 'No stop found.' : 'Could not load the stop list. Check your internet.'}</p>`;
  box.querySelectorAll('button').forEach(b => b.onclick = () => { pickStop(b.dataset.t, b.dataset.code, box); $('q').value = ''; });
});
function findNear(target) {
  const box = $('nearby');
  if (!navigator.geolocation) { box.innerHTML = '<p class="err">Location is not available on this device.</p>'; return; }
  box.innerHTML = '<p class="note">Finding your location…</p>';
  navigator.geolocation.getCurrentPosition(async pos => {
    const { latitude: la, longitude: lo } = pos.coords;
    await loadStops();
    const list = Object.entries(STOPS).map(([code, s]) => ({ code, name: s[2], road: s[3], d: distM(la, lo, s[1], s[0]) }))
      .sort((a, b) => a.d - b.d).slice(0, 6);
    if (!list.length) { box.innerHTML = '<p class="err">Could not load the bus stop list.</p>'; return; }
    box.innerHTML = '<p class="note">Tap the right one:</p>' + list.map(s =>
      `<button class="pick" data-code="${s.code}"><b>${s.name}</b> · ${s.road}<br><span class="hint">${s.code} · ${s.d} m away</span></button>`).join('');
    box.querySelectorAll('.pick').forEach(b => b.onclick = () => pickStop(target, b.dataset.code, box));
  }, () => box.innerHTML = '<p class="err">Location permission denied. Search by name instead.</p>',
  { enableHighAccuracy: true, timeout: 10000 });
}
$('nearHome').onclick = () => findNear('homeStop');
$('nearSchool').onclick = () => findNear('schoolStop');

// ---------- tabs & refresh ----------
let tab = 'morning';
function show(t) {
  tab = t;
  ['morning', 'school', 'settings'].forEach(x => $('tab-' + x).classList.toggle('hidden', x !== t));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  window.scrollTo(0, 0);
  refresh();
}
function refresh(maxAge = 0) {
  if (tab === 'morning') renderMorning(maxAge);
  else if (tab === 'school') renderSchool();
  else fillSettings();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.tab));
setInterval(() => { if (tab !== 'settings') refresh(); }, 30000);
// Between fetches, re-check the countdown every 5 s from the last data so the alert is not late
setInterval(() => { if (tab === 'morning') refresh(60000); }, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { keepAwake(); if (tab !== 'settings') refresh(); } });
drawAlert(); keepAwake();

// Start: 11am–8pm opens "After school", otherwise "Morning"
loadStops().then(() => refresh());
loadFirst().then(() => { if (tab === 'morning') renderPlan(); });
const h0 = new Date().getHours();
show(h0 >= 11 && h0 < 20 ? 'school' : 'morning');
</script>
